name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python example deps
        run: pip install requests cryptography
      - name: Lint
        run: ./scripts/lint.sh
      - name: Package skill
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: units-skill
          path: dist/units-skill.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: ./scripts/package.sh
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/units-skill.zip
          generate_release_notes: true
